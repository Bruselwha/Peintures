<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo · Arij Color</title>
<meta name="description" content="Consulta el catálogo y haz tu pedido por WhatsApp.">
<meta name="theme-color" content="#5B1A80">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arij Color">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235B1A80'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css?v=23">
<link rel="stylesheet" href="assets/css/catalog.css?v=16">
<link rel="stylesheet" href="assets/css/assistant.css?v=7">
</head>
<body class="catalog-page">
<a class="skip-link" href="#catalog">Saltar al contenido</a>

<!-- Cabecera -->
<header class="cat-header" data-cat-header>
  <div class="wrap cat-head-inner">
    <a class="cat-brand" data-cat-brand href="https://peintures.arijcolor.com/catalogo?b=peintures" aria-label="Peintures Arij Color"></a>

    <!-- Menú (categorías + buscador). En escritorio va entre el logo y las
         banderas; en móvil se despliega desde la hamburguesa. -->
    <div class="cat-drop" data-cat-drop>
      <div class="cat-menu" data-cat-menu></div>
      <div class="cat-mobile-extra">
        <div class="lang-switch" data-lang-switch></div>
        <button type="button" class="btn ghost small" data-pwa-open>📲 <span data-i18n="pwa.open">Instalar app</span></button>
        <a class="btn ghost small" data-pf-link href="#" hidden>Porfolio</a>
        <a class="btn wa small" data-wa-header href="#" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>
    </div>

    <div class="cat-head-actions">
      <div class="lang-switch" data-lang-switch></div>
      <a class="btn wa small" data-wa-header href="#" target="_blank" rel="noopener">💬 WhatsApp</a>
    </div>

    <button type="button" class="cat-burger" data-cat-burger aria-label="Menú" aria-expanded="false">☰</button>
  </div>
</header>

<!-- Menú del catálogo -->
<nav class="cat-nav" aria-label="Principal">
  <div class="wrap cat-nav-inner">
    <a href="#inicio" data-i18n="nav.home">Inicio</a>
    <a href="#categorias" data-i18n="nav.categories">Categorías</a>
    <a href="#resenas" data-i18n="nav.reviews">Reseñas</a>
    <a href="#contacto" data-i18n="nav.contact">Contacto</a>
  </div>
</nav>

<div data-catalog-root id="inicio">
  <div class="wrap loading-block" data-loading><p class="muted" data-i18n="common.loading">Cargando…</p></div>
</div>

<!-- Carrito -->
<div class="cart-overlay" data-cart-overlay hidden></div>
<aside class="cart-drawer" data-cart hidden>
  <div class="cart-head">
    <h3 data-i18n="cat.public.cart">Tu pedido</h3>
    <button class="icon-btn" data-cart-close aria-label="Cerrar">✕</button>
  </div>
  <div class="cart-body" data-cart-body></div>
  <div class="cart-foot" data-cart-foot></div>
</aside>

<button class="cart-fab" data-cart-fab hidden>🛒 <span data-cart-count>0</span></button>

<!-- Instalar la app del catálogo (solo móvil) -->
<div class="pwa-banner pwa-banner--cat" data-pwa-banner>
  <span class="pwa-ic" aria-hidden="true">📲</span>
  <div class="pwa-tx">
    <b data-i18n="pwa.title">Instala el catálogo</b>
    <small data-i18n="pwa.sub">Acceso directo desde tu móvil</small>
  </div>
  <button class="btn primary small" data-pwa-install data-i18n="pwa.install">Instalar</button>
  <button class="icon-btn" data-pwa-dismiss aria-label="Cerrar">✕</button>
</div>

<script defer src="assets/js/config.js?v=11"></script>
<script defer src="assets/js/i18n.js?v=26"></script>
<script defer src="assets/js/store.js?v=13"></script>
<script defer src="assets/js/common.js?v=17"></script>
<script defer src="assets/js/catalog.js?v=22"></script>
<script defer src="assets/js/policies.js?v=7"></script>
<script defer src="assets/js/assistant.js?v=9"></script>
<script>
  /* Si el catálogo no llega a pintarse (red, caché antigua, etc.), no dejamos
     la pantalla congelada en «Cargando…»: mostramos un aviso y un botón. */
  setTimeout(function () {
    var root = document.querySelector('[data-catalog-root]');
    if (!root || !root.querySelector('[data-loading]')) return;
    if (root.querySelector('.pc, .empty-state')) return;
    root.innerHTML = '<div class="wrap empty-state big"><div class="es-icon">📡</div>' +
      '<b>No se pudo cargar el catálogo</b>' +
      '<p>Revisa tu conexión y vuelve a intentarlo.</p>' +
      '<button class="btn primary" onclick="location.reload()">Reintentar</button></div>';
  }, 12000);
</script>
</body>
</html>
